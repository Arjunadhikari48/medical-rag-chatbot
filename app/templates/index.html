<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Medical RAG Chatbot</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="layout">
    <section class="panel sidebar">
      <h1>Medical RAG</h1>
      <p class="muted">Upload trusted medical reference documents, then ask grounded questions.</p>
      <form id="upload-form">
        <input id="document" type="file" accept=".pdf,.docx,.txt,.md" required>
        <button type="submit">Index document</button>
      </form>
      <div id="upload-status" class="status"></div>
      <div id="socket-status" class="status">WebSocket connecting...</div>
      <p class="warning">Educational use only. Not for diagnosis, prescriptions, or emergencies.</p>
      <a href="/docs" target="_blank">Open API documentation</a>
    </section>

    <section class="panel chat-panel">
      <div id="messages" class="messages">
        <article class="message assistant">Upload one or more reference documents and ask a medical question.</article>
      </div>
      <form id="chat-form" class="composer">
        <textarea id="question" rows="3" placeholder="Ask a medical-topic question..." required></textarea>
        <button type="submit">Send</button>
      </form>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
